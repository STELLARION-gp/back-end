name: Deploy Backend to Digital Ocean

on:
  push:
    branches:
      - main
      - release
      - deploy-implementation
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/deploy/deployments/stellarion

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build test
        run: npm run build
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

  deploy:
    name: Deploy to Digital Ocean
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Digital Ocean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e

            echo "🚀 Starting backend deployment..."

            # Check and cleanup disk space if needed
            DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "📊 Current disk usage: ${DISK_USAGE}%"
            if [ $DISK_USAGE -gt 80 ]; then
              echo "⚠️  Disk usage high, running cleanup..."
              docker system prune -f --filter "until=168h"
              docker volume prune -f
              apt-get clean 2>/dev/null || true
            fi

            # Navigate to deployment directory
            cd ${{ env.DEPLOY_PATH }}

            # Create backup
            echo "📦 Creating backup..."
            BACKUP_DIR="backups/backend-$(date +%Y%m%d-%H%M%S)"
            mkdir -p $BACKUP_DIR
            cp -r back-end $BACKUP_DIR/ 2>/dev/null || true

            # Keep only last 3 backups
            cd backups
            ls -t | tail -n +4 | xargs -r rm -rf
            cd ..

            # Pull latest changes
            echo "📥 Pulling latest code..."
            cd back-end
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            cd ..

            # Stop backend container
            echo "🛑 Stopping backend..."
            docker-compose stop backend 2>/dev/null || true
            docker-compose rm -f backend 2>/dev/null || true

            # Build and start backend
            echo "� Building and starting backend..."
            docker-compose build --no-cache backend
            docker-compose up -d backend

            # Wait for backend to be ready (increased for Prisma/Firebase init)
            echo "⏳ Waiting for backend to be ready..."
            sleep 40

            # Health check
            echo "🔍 Running health check..."
            if docker exec stellarion-backend wget -qO- http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend deployment successful!"
            else
              echo "❌ Health check failed!"
              echo "📋 Container logs (last 50 lines):"
              docker logs stellarion-backend --tail 50
              echo ""
              echo "🔍 Container status:"
              docker ps -a | grep stellarion-backend
              echo ""
              echo "❌ Rolling back..."
              docker-compose down backend
              cp -r $BACKUP_DIR/back-end/* back-end/
              docker-compose up -d backend
              exit 1
            fi

            # Cleanup Docker resources
            echo "🧹 Cleaning up Docker resources..."
            docker image prune -f
            docker container prune -f --filter "until=168h"

            # Show final disk usage
            FINAL_USAGE=$(df / | tail -1 | awk '{print $5}')
            echo "📊 Final disk usage: ${FINAL_USAGE}"

            echo "✨ Deployment completed!"

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Backend deployed successfully to ${{ secrets.SSH_HOST }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
